etime budget, and where that number comes from\n- How a `ui_qml` Logos plugin is launched standalone and driven headless\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** The app runs under `QT_QPA_PLATFORM=offscreen`, so no display is needed.\n- **No network account needed.** The run publishes to an in-process store."}, {"execs": [], "md": "## Step 1: Build the app\n\nOne flake output builds everything: the Rust library that decides what an\naccount may do, the C++ backend that marshals for it, and the QML the\nperson reads. The library is built inside this flake and handed to the\nmodule builder as an external library, so the archive and the plugin that\nlinks it are versioned by one commit."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-accountlog-ui/09b24da73a2d2a30be5d2ad1630200ec049ff74d' -o result", "exit_code": 0, "kind": "run", "note": "", "output": "unpacking 'github:logos-co/logos-accountlog-ui/09b24da73a2d2a30be5d2ad1630200ec049ff74d' into the Git cache...\nunpacking 'github:logos-co/logos-module-builder/de169fd45d7bdf6e28ce1f151b4c34880523ace9?narHash=sha256-OnO5xxnwVpFBTqbOWbUpjECkbAD7d%2BU82wdbJxWAqdg%3D' into the Git cache...\ncopying path '/nix/store/8sa9pwyzb94syjjd4vl9s618sam4g8q2-source' from 'https://cache.nix.logos.co/ci'...\ncopying path '/nix/store/a30408ybri874zphhix5mrcv6x6jq46y-source' from 'https://cache.nix.logos.co/public'...\nunpacking 'github:logos-co/logos-design-system/e43a4817b0febc508ce1c044dd424c08598036a8?narHash=sha256-OXMurChZK6ZmWm%2BMS9FsA9C4tNvuLi1naK333/E3%2BX0%3D' into the Git cache...\ncopying path '/nix/store/5r25nmlbzs9l9xcr1ldlwipqvccqwzqw-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/2qaxzad3g8w3zkw2ar4125yisfzkik6q-source' from 'https://cache.nix.logos.co/ci' ix build 'github:logos-co/logos-accountlog-ui' -o result\n```"}, {"execs": [{"cmd": "check file: result/lib/*accountlog_ui*plugin.so", "kind": "check_file", "note": "Found: /home/runner/work/_temp/doctest-test-8apogszf/result/lib/accountlog_ui_plugin.so", "status": "pass"}], "md": "### 1.2 The plugin really landed"}, {"execs": [{"cmd": "ls result/lib", "exit_code": 0, "kind": "run", "note": "", "output": "accountlog_ui_plugin.so\naccountlog_ui_replica_factory.so\nmetadata.json\nqml\nsrc\n", "status": "pass"}], "md": "### 1.3 What a Logos plugin is, on disk\n\n```bash\nls result/lib\n```\n\n`metadata.json` declares the plugin `type: ui_qml` and names its view;\n`qml/` is the view itself; the shared library holds the backend. The\nhost reads the metadata, loads the library into an isolated `ui-host`\nchild process, and renders the QML in its own window."}, {"execs": [], "md": "## Step 2: Write an account log\n\n`nix run` on this flake launches the plugin inside\n[`logos-standalone-app`](https://github.com/logos-co/logos-standalone-app),\nthe generic Qt host, built against the same design-system revision as the\nplugin. Everything from here is the app driven through its own QML\nsurface: no test hooks, no back doors into the library."}, {"execs": [{"cmd": "env LOGOS_ACCOUNTLOG_VAULT_DIR=$PWD/vault LOGOS_ACCOUNTLOG_STORE_URL=memory nix run 'github:logos-co/logos-accountlog-ui/09b24da73a2d2a30be5d2ad1630200ec049ff74d'\n\n# test actions:\n- An empty vault opens its own door: wait for ['Add an account']\n- ...and it is the screen, not just a string in the tree: expect ='addAccountScreen' .visible == True\n- Choose to make a key here: click ='createAccountDoorAction'\n- The password is the account's own choice: wait for ['Protect this account with a password']\n- The create screen took over: expect ='createAccountScreen' .visible == True\n- Type the password: set objectName='createPasswordField' to 'a long quiet sentence'\n- Confirm it: set objectName='createPasswordConfirmField' to 'a long quiet sentence'\n- Make the key: click ='createAccountSubmit'\n- The account has a log, and the log is empty: wait for ['No pending entries', 'Nothing published yet. This account has claimed no address in the store.']\n- The Manage pane is what is drawn now: expect ='managePane' .visible == True\n- Open the display-name sheet: click ='displayNameButton'\n- The sheet says what it will cost before it stages anything: wait for ['Set display name']\n- Name the account: set objectName='displayNameField' to 'Saro'\n- Stage the name: click ='displayNameSheetConfirm'\n- The edit is staged, not written: wait for ['1 pending entry \u00b7 +28 B']\n- Publish: click ='publishButton'\n- The key is sealed, so publishing asks for the password: wait for ['Publish 1 entry']\n- Type the account's password: set objectName='publishPasswordField' to 'a long quiet sentence'\n- Sign and send: click ='publishSheetConfirm'\n- The log holds one entry, and the store serves it: wait for ['#0', 'profile.displayname', 'Saro', '28']\n- Endorse an installation: click ='addInstallationButton'\n- The key is pasted from the installation that holds it: wait for ['Paste the public key the installation shows. The account endorses it by appending an entry to its log.']\n- Paste the installation's public key: set objectName='installationKeyField' to '50493a4f65e5bbb98b68c4f9608dfa860a975c31c3b6db40b61958af345a6fce'\n- Stage the endorsement: click ='addInstallationSheetConfirm'\n- An endorsement costs 48 bytes, whatever the key: wait for ['1 pending entry \u00b7 +48 B']\n- Publish the endorsement: click ='publishButton'\n- Type the password again: set objectName='publishPasswordField' to 'a long quiet sentence'\n- Sign and send: click ='publishSheetConfirm'\n- The account now endorses an installation: wait for ['chat.signer', '#1', '48', '1 live']", "kind": "ui_test", "note": "", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Writing an account log: a key, a name, an installation, one update: Launch the app on an empty vault\n\n1 passed, 0 failed\n\n", "status": "pass"}], "md": "### 2.1 Launch the app on an empty vault\n\n```bash\nenv LOGOS_ACCOUNTLOG_VAULT_DIR=$PWD/vault LOGOS_ACCOUNTLOG_STORE_URL=memory nix run 'github:logos-co/logos-accountlog-ui/09b24da73a2d2a30be5d2ad1630200ec049ff74d'\n```\n\nThere is nothing to manage until the module holds a key, so an\nempty vault opens the door itself. The app writes accounts, so\nevery account it holds needs that account's signing key: it can\nmake one, or take custody of one made elsewhere.\n\n![An empty vault opens its own door](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeVgUV6L38dNNA82mgCAgsrsD4goILoAIauISN+KSTIwxMyazOfMkcyeZ5M69s2TuPEnuk8yMSWaS6BhjNGjct6i4RHFfURRlFWURZBPsBpru9496p24NS9sqBrW+nz98qrq206eq8fyqTlVpfHx8BAAAAAB10HZ1AQAAAAB8fwgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAAAAAACoCAEAAAAAUBECAAAAAKAiBAAAAABARQgAAAAAgIoQAAAAAAAVIQAAAAAAKkIAAAAAAFSEAA nlater costs 7 more bytes for the removal plus the new name's own.\n\nThat is why the app quotes a price before it stages an edit, and why every\none of those numbers is measured by encoding the entry with the format's\nown encoder rather than recomputed here. A screen that disagreed with the\nencoder would be a screen that lies about how much life the account has\nleft.\n\nThe store this run published to was in-process. The same bytes go to\nchat-store once the account route lands; nothing above changes, because\nthe app already signs and frames the log the way the service will read it."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
