y-logos-qt-host-0.1.0' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/kzwnkmndavi1x6fx4icd56y2qgs36h9a-logos-qt-sdk-lib-0.1.0' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/7zk6lk0a74fl9v4yfm9s8mvp2h8aw9fk-logos-qt-sdk' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/lami1gbfhz609fd6d8pi91sxppvyvq8r-rustc-1.89.0' from 'https://cache.nixos.org'...\ncopying path '/nix/store/hcginxlb1vivl6v6vjmi61s96082270d-rustc-wrapper-1.89.0' from 'https://cache.nixos.org'...\ncopying path '/nix/store/xq6ns6hdgl7fdshisp5mb65f1jlysm0h-cargo-1.89.0' from 'https://cache.nixos.org'...\ncopying path '/nix/store/njcdzjkw51b1g2w60s9vrd24m7lb8a94-auditable-cargo-1.89.0' from 'https://cache.nixos.org'...\nbuilding '/nix/store/iazafbwnh4xpq935bs75xq4dw6zz68b2-account-0.1.0.drv'...\nbuilding '/nix/store/cmj6llzpak3p45dm09g2bil01i9sag8a-account-log-0.1.0.drv'...\nbuilding '/nix/store/873r2mq7gd2dgabnb1qgi8aiph2fgm2r-cargo-vendor-dir.drv'...\nbuilding '/nix/store/192b6n1maywlvxwrwg2lfg9f35chi9rd-logos-account-core-0.3.0.drv'...\nbuilding '/nix/store/272df1lr43hjg1190gny2q7wvn8qqgj6-logos-accountlog_ui-module-lib-0.3.0.drv'...\nbuilding '/nix/store/mr2sspy2viz2yvzch8alvqyz4ssiza4y-logos-accountlog_ui-module.drv'...\n", "status": "pass"}], "md": "### 1.1 Build the plugin\n\n```bash\nnix build 'github:logos-co/logos-accounts-ui' -o result\n```"}, {"execs": [{"cmd": "check file: result/lib/*accountlog_ui*plugin.so", "kind": "check_file", "note": "Found: /home/runner/work/_temp/doctest-test-wgx_0hov/result/lib/accountlog_ui_plugin.so", "status": "pass"}], "md": "### 1.2 The plugin really landed"}, {"execs": [{"cmd": "ls result/lib", "exit_code": 0, "kind": "run", "note": "", "output": "accountlog_ui_plugin.so\naccountlog_ui_replica_factory.so\nmetadata.json\nqml\nsrc\n", "status": "pass"}], "md": "### 1.3 What a Logos plugin is, on disk\n\n```bash\nls result/lib\n```\n\n`metadata.json` declares the plugin `type: ui_qml` and names its view;\n`qml/` is the view itself; the shared library holds the backend. The\nhost reads the metadata, loads the library into an isolated `ui-host`\nchild process, and renders the QML in its own window."}, {"execs": [], "md": "## Step 2: Write an account log\n\n`nix run` on this flake launches the plugin inside\n[`logos-standalone-app`](https://github.com/logos-co/logos-standalone-app),\nthe generic Qt host, built against the design-system revision basecamp\n0.3.0 ships. Everything from here is the app driven through its own QML\nsurface: no test hooks, no back doors into the library.\n\nThe `walkthrough` app is what drives it. It launches the plugin headless\non an empty vault, makes a key sealed with a password, names the account,\npublishes, endorses an installation key and publishes again. Then it\nmakes a second account, publishes a name from it, gives its key up, and\ntakes the address back on as one it only reads. Every step is finished\nwhen the app itself says so, and the picture is taken then, so each one\nbelow is a state the app really reached.\n\nTwo things make that run hermetic. `LOGOS_ACCOUNTLOG_VAULT_DIR` puts the\nkey files in the run's own directory, so the walkthrough always starts\nfrom an empty vault. `LOGOS_ACCOUNTLOG_STORE_URL=memory` selects the\nin-process store instead of chat-store on devnet, so the run needs no\nnetwork and leaves no log behind, and the in-process store enforces the\nsame rule chat-store's `/v1/account` does, that a log is accepted only\nwhere it extends the one already held.\n\nThere is nothing to manage until the module holds a key, so an empty vault\nopens the door itself. The app writes accounts, so every account it holds\nneeds that account's signing key: it can make one, or take custody of one\nmade elsewhere.\n\n![An empty vault opens its own door](images/01-add-an-account.png)\n\nA password seals this one account's key as an eth-keystore document;\nwithout one the key is stored unsealed, and the screen says which at every\npoint where it matters. The choice is per account, not per module.\n\n![The password is the account's own choice](images/02-create-an-account.png)\n\nThe key now exists on this computer and the address is derived from it,\nbut the store has never heard of it. An update that stages no entry is\nrefused, so the address is claimed by the log's first entry and never by\nan empty publish.\n\n![A key, and nothing published](images/03-nothing-published-yet.png)\n\nNaming the account sends nothing. Edits collect as **entries**, numbered\nas they will be once the update lands, and the bar prices the next publish\nbefore it happens: 24 bytes for an empty display-name entry by the\nformat's own encoder, plus the four UTF-8 bytes of `Saro`.\n\n![The edit is staged, not written](images/04-one-pending-entry.png)\n\nEntry `#0` is the name, written under `profile.displayname`. The whole log\nwas signed, not just the new entry, which is why a publish is all of the\nstaged entries or none of them.\n\n![The store serves the first entry](images/05-first-entry-published.png)\n\nAn endorsement costs 48 bytes whatever the key. Entry `#1` writes it under\n`chat.signer`, and the live set replayed from the log now names one\ninstallation. Entry `#0` is still there and still says `Saro`: the log\ngrew, nothing in it moved.\n\n![The account endorses an installation](images/06-installation-endorsed.png)\n\nAn account is a log in a store, and a key is what writes it. Take the key\naway and the log is still there, still verifiable against the address\nthat names it, and still readable by anyone who asks the store for it. So\nthe walkthrough makes a second account, publishes a name from it, gives\nits key up, and then takes the address back on as one it only **observes**\n-- the one way a run with no second computer can show what every other\naccount in the world looks like from here.\n\nWhat comes back is the same screen with everything that needs a key taken\nout of it: the log as the store serves it, verified under that address,\nand nothing to publish. Reading an account takes no key and sends none,\nand the account never learns that anyone is reading.\n\n![An account this module reads and cannot write](images/07-an-observed-account.png)"}, {"execs": [{"cmd": "nix run 'github:logos-co/logos-accounts-ui/51c6659babcbd2cff49f6a1f09a5e81b4707f95e#walkthrough'\n\n# test actions:\n- The account log, written and published: wait for ['#1', '28', '48', '1 live']", "kind": "ui_test", "note": "", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Writing an account log: a key, a name, an installation, one update: Write the log and show it\n\n1 passed, 0 failed\n\n", "status": "pass"}], "md": "### 2.1 Write the log and show it\n\n```bash\nnix run 'github:logos-co/logos-accounts-ui/51c6659babcbd2cff49f6a1f09a5e81b4707f95e#walkthrough'\n```\n\nThe same log, captured by this run rather than by the one the\npictures above came from: the `walkthrough` app holds the\nfinished window open, and this step attaches to it and reads the\nlog's own cells back. The meter reads what the two entries spent\nagainst the format's 128 KiB cap, and every number in it was\nmeasured by encoding the entry with the format's own encoder.\n\n![The account log, written and published](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdd0AUV/4A8Dc7s5XdhV12YSkiRUClqbEjFkCMYokY+xE18fSSmGISL/nFxHhnTr3kTDeXy51RozEmKtHEXhBFVAQrgiAd6W0X2L47O78/3t0cRxOQpnw/fy3DlDdvZ2bf980rhLOzMwIAAAAAAAD0D5zeTgAAAAAAAACg50AAAAAAAAAAQD8CAQAAAAAAAAD9CAQAAAAAAAAA9CMQAAAAAAAAANCPQAAAAAAAAABAPwIBAAAAAAAAAP0IBAAAAAAAAAD0IxAAAAAAAAAA0I9AAAAAAAAAAEA/AgEAAAAAAAAA/QgEAAAAAAAAAPQjEAAAAAAAAADQj0AAAAAAAAAAQD8CAQAAAAAAAAD9CPUoGwsEAplMJhaLuVwuhwOxBAAAAAAAAN3FZrNZLBatVqtWq41GY6f3Qzg7O3dmM4JQqVQymayhocFgMFitVoZhOp0IAAAAAAAAQNsIgqAoSigUSiQStVpdXl7euRJ4ZwIAgiA8PT1JklSr1VartRNHBQAAAAAAAHQORVEymYym6YKCgk7EAJ1pt6NSqUiSrKqqgtI/AAAAAAAAPcxqtVZVVZEk6eLi0onNOxw ted here. A screen that disagreed with the\nencoder would be a screen that lies about how much life the account has\nleft.\n\nThe store this run published to was in-process. The same bytes go to\nchat-store once its `/v1/account` route is deployed; nothing above\nchanges, because the service stores the very artifact the app signs."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
