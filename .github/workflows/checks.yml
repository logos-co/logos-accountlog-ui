name: Checks

# Three gates, cheapest first: the Rust library that does all the account work,
# the QML that draws it, and the plugin itself built the way a release builds it.
#
# The QML gate needs the Logos design system on the import path. The design
# system is static-linked into the host binary, so no built artifact carries a
# loose QML tree; its source tree is taken instead, at the rev this flake
# resolves through the module builder, which is the one basecamp 0.3.0 ships.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: rust-core
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: fmt, clippy, test
        shell: bash
        working-directory: rust-core
        run: |
          set -euo pipefail
          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#clippy nixpkgs#rustfmt \
                    nixpkgs#gcc nixpkgs#pkg-config --command bash -c '
            set -euo pipefail
            cargo fmt --check
            cargo clippy --all-targets -- -D warnings
            cargo test
          '

  qml:
    name: qmllint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Locate the Logos design system
        id: ds
        shell: bash
        run: |
          set -euo pipefail
          importpath="$(nix eval --impure --raw --expr \
            '(builtins.getFlake (toString ./.)).inputs.logos-module-builder.inputs.logos-design-system.outPath')/src/qml"
          if [ ! -d "$importpath/Logos/Theme" ]; then
            echo "No Logos/Theme under $importpath" >&2
            exit 1
          fi
          echo "importpath=$importpath" >> "$GITHUB_OUTPUT"

      - name: qmllint
        shell: bash
        run: |
          set -euo pipefail
          nix shell nixpkgs#qt6.qtdeclarative --command bash -c '
            set -euo pipefail
            qmllint --version
            # This qmllint is unwrapped, so QtQuick is not on its default
            # import path and every type in the tree would come back
            # unresolved. The modules sit next to the binary.
            qtqml="$(dirname "$(dirname "$(readlink -f "$(command -v qmllint)")")")/lib/qt-6/qml"
            [ -d "$qtqml/QtQuick/Layouts" ] || { echo "QtQuick.Layouts not under $qtqml" >&2; exit 1; }
            # qmllint exits 0 on warnings by default, so --max-warnings 0 is
            # what makes this a gate at all. `logos` is a context property the
            # ui-host installs: qmllint cannot know it and reports every use as
            # unqualified, so that one category is reported without counting.
            qmllint \
              --max-warnings 0 \
              --unqualified info \
              -I src/qml \
              -I "${{ steps.ds.outputs.importpath }}" \
              -I "$qtqml" \
              $(find src/qml -name "*.qml" | sort)
          '

  module:
    name: nix build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build the plugin
        shell: bash
        run: nix build .#default --print-build-logs
