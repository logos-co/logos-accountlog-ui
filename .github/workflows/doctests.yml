name: Doc-Tests

# Runs this repo's executable doc-test end-to-end via the shared `doctest` CLI
# (github:logos-co/logos-doctest), then publishes the rendered two-column HTML
# report to GitHub Pages and, on a pull request, posts the link.
#
# The spec builds the plugin and runs the `walkthrough` app, which launches it
# in logos-standalone-app headless and drives the real QML surface: make a key,
# name the account, endorse an installation, publish. It runs against the
# in-process store, so it needs no network service and asserts the same rules
# the real one will.
#
# One-time setup for the published links to work:
#   Repo Settings -> Pages -> Source: "Deploy from a branch", Branch: gh-pages /
#   (root). The publish-report job creates the gh-pages branch on its first run.
#
# Reports are published to:
#   https://<owner>.github.io/<repo>/                 (index of every ref)
#   https://<owner>.github.io/<repo>/main/<os>/       (pushes to main)
#   https://<owner>.github.io/<repo>/pr-<N>/<os>/     (pull requests)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: doctests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctests:
    # Linux only, unlike the chat-ui and evm-signer matrices. Nothing in this
    # app is platform-specific, and a macOS runner would build the whole Qt and
    # account stack from source before the first assertion. Adding macOS is one
    # line here and one in the publish job's loop.
    name: doc-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    # ATTIC_TOKEN_PUBLIC exists only in the public-cache environment, which a
    # main-branch job has to opt into before it can publish to the public cache.
    environment: ${{ github.ref == 'refs/heads/main' && 'public-cache' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      # The commit under test. For a pull request this is the head commit, so
      # the spec's `{release}` placeholder resolves to THIS branch rather than
      # main. A fork PR's head is not in this repo, so nix could not fetch it:
      # blank the SHA and the run falls back to main.
      - name: Resolve commit under test
        id: commit
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "Fork PR: the doc-test will run against main."
          else
            echo "sha=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # The host links against system OpenGL, which a bare runner does not have;
      # nix supplies Qt but not the GL loader, and the app would die before it
      # could open the inspector port.
      - name: Install GL libraries
        run: sudo apt-get update && sudo apt-get install -y libopengl0 libglx0 libgl1 libegl1

      - name: Run doc-tests
        shell: bash
        run: |
          # --continue-on-fail so the run walks every step and the published
          # report is complete; the job still fails if any step did.
          nix run github:logos-co/logos-doctest -- run \
            doctests/accountlog-ui.test.yaml \
            --verbose \
            --continue-on-fail \
            --release-for logos-accountlog-ui=${{ steps.commit.outputs.sha }} \
            --report "${{ runner.temp }}/accountlog-ui-doctest-report.html"

      - name: Stage report for upload
        if: always()
        shell: bash
        run: |
          mkdir -p report-out
          # Named index.html so the published directory URL renders directly.
          if [ -f "${{ runner.temp }}/accountlog-ui-doctest-report.html" ]; then
            cp "${{ runner.temp }}/accountlog-ui-doctest-report.html" report-out/index.html
          else
            echo "<h1>No report produced</h1>" > report-out/index.html
          fi

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accountlog-ui-doctest-report-${{ matrix.os }}
          path: report-out/index.html
          if-no-files-found: warn

      - name: Verify markdown generation
        run: |
          nix run github:logos-co/logos-doctest -- generate \
            doctests/accountlog-ui.test.yaml \
            --release-for logos-accountlog-ui=${{ steps.commit.outputs.sha }} \
            -o /tmp/accountlog-ui.md
          test -s /tmp/accountlog-ui.md

  # The walkthrough, run for its pictures rather than for its verdict on the
  # tutorial. It drives the same app the doc-test drives, checks the app's own
  # state at every step and captures one screenshot of each, so it is a real
  # end-to-end check with its own red or green beside the doc-test's. The
  # publish job collects what it captured and lays it down beside the report,
  # which is what the tutorial's figures resolve against.
  #
  # A sibling of doc-tests, not a dependency of it: both want the same app
  # closure, and running them in parallel costs one substitution on a second
  # runner, where chaining them would cost that plus the whole first job.
  walkthrough:
    name: walkthrough screenshots
    environment: ${{ github.ref == 'refs/heads/main' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      # The host links against system OpenGL, which a bare runner does not have.
      - name: Install GL libraries
        run: sudo apt-get update && sudo apt-get install -y libopengl0 libglx0 libgl1 libegl1

      # FLAKE defaults to the checked-out tree, which on a pull request is the
      # merge commit: the pictures show what merging would publish.
      - name: Write an account log and screenshot every step
        run: bash doctests/walkthrough/run-walkthrough.sh

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accountlog-ui-walkthrough-screenshots
          path: doctests/images/*.png
          if-no-files-found: error

  publish-report:
    name: Publish report to GitHub Pages
    needs: [doctests, walkthrough]
    # Run even when the doc-test failed: a red run is exactly when the report is
    # worth opening. Skip on forks, whose token can neither push nor comment.
    if: ${{ always() && github.event.pull_request.head.repo.fork != true }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    # Serialize Pages pushes so two refs cannot race on the gh-pages branch.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Arrange this ref's reports
        id: arrange
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="pr-${{ github.event.pull_request.number }}"
          else
            BASE="main"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          mkdir -p "site/$BASE"
          # The bare download above takes every artifact of this run, so the
          # walkthrough job's captures are already here.
          shots="artifacts/accountlog-ui-walkthrough-screenshots"
          found=""
          for os in ubuntu-latest; do
            src="artifacts/accountlog-ui-doctest-report-$os/index.html"
            if [ -f "$src" ]; then
              mkdir -p "site/$BASE/$os"
              cp "$src" "site/$BASE/$os/index.html"
              # The tutorial's figures are written as plain `images/<file>.png`,
              # which the report resolves against its own published URL. They
              # land beside it here rather than inside it, because the harness
              # inlines only what its own ui_test captured.
              if compgen -G "$shots/*.png" > /dev/null; then
                mkdir -p "site/$BASE/$os/images"
                cp "$shots"/*.png "site/$BASE/$os/images/"
              fi
              found="$found $os"
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

          {
            echo "<!doctype html><meta charset=utf-8>"
            echo "<title>logos-accountlog-ui doc-test report: $BASE</title>"
            echo "<style>body{font:16px system-ui;margin:40px;max-width:680px}a{color:#2563eb}</style>"
            echo "<h1>logos-accountlog-ui: $BASE</h1>"
            echo "<p>commit <code>${GITHUB_SHA::7}</code> · <a href=\"../\">all reports</a></p><ul>"
            for os in ubuntu-latest; do
              [ -d "site/$BASE/$os" ] && echo "<li><a href=\"./$os/\">$os</a></li>"
            done
            echo "</ul>"
          } > "site/$BASE/index.html"

      # The root landing page, listing every ref that has a published report.
      # Rebuilt each run from what gh-pages already holds plus this ref; the
      # deploy keeps the other refs' directories untouched.
      - name: Build root index
        if: steps.arrange.outputs.found != ''
        shell: bash
        run: |
          set -euo pipefail
          refs=""
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://github.com/${{ github.repository }}.git" existing 2>/dev/null || true
            refs="$(ls -1 existing 2>/dev/null | grep -E '^(main|pr-[0-9]+)$' || true)"
          fi
          refs="$(printf '%s\n%s\n' "$refs" "${{ steps.arrange.outputs.base }}" | sort -u | grep -v '^$' || true)"
          {
            echo "<!doctype html><meta charset=utf-8>"
            echo "<title>logos-accountlog-ui doc-test reports</title>"
            echo "<style>body{font:16px system-ui;margin:40px;max-width:680px}a{color:#2563eb}li{margin:.35em 0}code{background:#f3f4f6;padding:1px 5px;border-radius:4px}</style>"
            echo "<h1>logos-accountlog-ui doc-test reports</h1>"
            echo "<p>The app built, launched headless and driven through its own QML surface, rendered beside the commands that ran and what they printed. <a href=\"https://github.com/${{ github.repository }}\">Source repository</a>.</p>"
            echo "<ul>"
            for ref in $refs; do
              label="$ref"; [ "$ref" = "main" ] && label="main (latest)"
              echo "<li><a href=\"./$ref/\">$label</a></li>"
            done
            echo "</ul>"
          } > site/index.html

      - name: Deploy to gh-pages
        if: steps.arrange.outputs.found != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          commit_message: "Publish doc-test report for ${{ steps.arrange.outputs.base }} (${{ github.sha }})"

      - name: Comment on PR with report links
        if: ${{ github.event_name == 'pull_request' && steps.arrange.outputs.found != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const base = "${{ steps.arrange.outputs.base }}";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const root = `https://${owner}.github.io/${repo}`;
            const oses = "${{ steps.arrange.outputs.found }}".trim().split(/\s+/).filter(Boolean);
            const links = oses.map(os => `- [\`${os}\` report](${root}/${base}/${os}/)`).join("\n");
            const marker = "<!-- accountlog-ui-doctest-report-links -->";
            const body =
              `${marker}\n` +
              `### 📊 Doc-test report\n\n` +
              `This commit built, launched headless and driven through the real QML ` +
              `surface, rendered beside the commands that ran and their output ` +
              `(commit \`${context.sha.slice(0,7)}\`):\n\n` +
              `${links}\n\n` +
              `Index of all reports: ${root}/\n\n` +
              `_Pages can take a minute to update after the run finishes._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
            }
