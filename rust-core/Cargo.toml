[package]
name = "logos_account_core"
version = "0.1.0"
edition = "2021"
description = "The account write path as a linkable library: keys in a vault, the log they sign, and the store it is published to."
license = "MIT OR Apache-2.0"
# The module builder's rustc, so the MSRV-aware resolver picks dependency
# versions it can compile.
rust-version = "1.89"

# Standalone crate: the empty table keeps cargo from adopting a parent workspace.
[workspace]
resolver = "3"

[lib]
name = "logos_account_core"
# staticlib is what the plugin links; rlib is what the tests build against.
crate-type = ["staticlib", "rlib"]

[dependencies]
# The key import and export this vault is built around is not on logos-chat's
# main: it is PR #255. Repinned to main when that lands.
account = { git = "https://github.com/logos-messaging/logos-chat.git", rev = "398cddbbc3795b13a52eb7f460f591597798e4b6" }
account-log = { git = "https://github.com/logos-messaging/logos-chat.git", rev = "398cddbbc3795b13a52eb7f460f591597798e4b6" }
eth-keystore = "0.5"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Blocking HTTP with rustls, so the archive carries no OpenSSL into the plugin.
ureq = { version = "3", default-features = false, features = ["rustls"] }
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
